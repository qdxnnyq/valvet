name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build app and installer
        working-directory: local
        shell: bash
        run: |
          set -eu
          go build -trimpath -ldflags "-s -w -H windowsgui" -o ../Valvet.exe .
          cp ../Valvet.exe setup/Valvet.exe
          cp rsrc_windows_amd64.syso setup/rsrc_windows_amd64.syso
          (cd setup && go build -tags setup -trimpath -ldflags "-s -w -H windowsgui" -o ../../ValvetSetup.exe .)
          rm -f setup/Valvet.exe setup/rsrc_windows_amd64.syso
      - uses: actions/upload-artifact@v4
        with:
          name: Valvet
          path: |
            Valvet.exe
            ValvetSetup.exe
