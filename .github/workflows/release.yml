name: Release
on:
  push:
    tags:
      - "v*"
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Build
        working-directory: local
        run: go build -ldflags "-H windowsgui" -o ../Valvet.exe .
      - uses: softprops/action-gh-release@v2
        with:
          files: Valvet.exe
